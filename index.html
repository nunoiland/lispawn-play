<!doctype html>
<html lang="ko">
  <head>
    <link rel="icon" href="data:," />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#A8D8A0" />
    <title>Lispawn</title>
    <style>
      /* UI 폰트(ART_DIRECTION §3, OFL — public/assets/fonts/SOURCES.md). 한글 Jua + 숫자·영문 Baloo 2.
         Baloo 2를 앞에 두면 라틴·숫자는 Baloo, 한글은 Jua로 떨어진다(unicode-range). 서브셋 밖 글자는 시스템 폰트. */
      @font-face {
        font-family: "Baloo 2";
        src: url("assets/fonts/baloo2.woff2") format("woff2");
        font-weight: 400 800;
        font-display: swap;
        unicode-range: U+0020-007E, U+00A0-00FF, U+2013-2014, U+2018-2019, U+201C-201D, U+2026, U+20A9, U+00D7, U+221E;
      }
      /* Jua는 굵기가 400 하나다 — 범위로 선언하고 합성을 꺼서(font-synthesis) 브라우저가 가짜 굵은 글씨를 만들지 않게 한다. */
      @font-face {
        font-family: "Jua";
        src: url("assets/fonts/jua.woff2") format("woff2");
        font-weight: 400 800;
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #4a3f35;
        overflow: hidden;
        height: 100%;
        /* 게임 화면 — 브라우저가 터치를 스크롤·확대 제스처로 가져가지 않게(가져가면 pointercancel로 스틱이 풀린다). 길게 눌러 글자 선택·콜아웃도 끈다. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* DOM UI 오버레이 루트 (Babylon 렌더러용 HUD/메뉴). 캔버스 위, 기본은 입력 통과. */
      #ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        font-family: sans-serif;
      }
      /* 직계 자식(메뉴 패널·오버레이)만 입력을 받는다. 예전 `#ui *`는 HUD 글자·스틱 손잡이까지 터치 타깃으로 만들어, 실기기에서 보이는
         스틱을 누르면 손잡이(touch-action 없음)가 터치를 받아 브라우저가 드래그를 가로챘다(2026-09-29 실측: pointercancel → 이동 불가).
         HUD·스틱은 루트에 pointer-events:none을 걸고 버튼만 auto로 연다. */
      #ui > * {
        pointer-events: auto;
      }
      /* 가로 게임 — 터치기기가 세로면 "돌려주세요" 안내(데스크톱 좁은 창엔 안 뜨게 pointer:coarse 한정). */
      #rotate {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #rotate .icon {
          animation: none;
          transform: rotate(-90deg);
        }
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #game {
          display: none;
        }
        #rotate {
          display: flex;
          position: fixed;
          inset: 0;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          gap: 16px;
          background: #a8d8a0;
          color: #4a3f35;
          font-family: "Baloo 2", "Jua", system-ui, sans-serif;
          font-synthesis: none;
          font-size: 18px;
          text-align: center;
        }
        /* 폰 모양(이모지는 기기마다 다르게 보여 쓰지 않는다 — DESIGN.md §9) */
        #rotate .icon {
          width: 40px;
          height: 68px;
          box-sizing: border-box;
          border: 3px solid #4a3f35;
          border-radius: 10px;
          background: #fff3dc;
          animation: tilt 1.6s ease-in-out infinite;
        }
      }
      @keyframes tilt {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-90deg); }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-DRRF1VIe.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/babylon-vendor-BZTsCszv.js">
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="rotate"><div class="icon"></div>가로로 돌려 주세요</div>
  </body>
</html>
